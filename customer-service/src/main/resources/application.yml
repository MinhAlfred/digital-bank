
spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5437/customer_db
    username: user
    password: password
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: customer-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
server:
  port: 4001