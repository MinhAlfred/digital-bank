spring:
  application:
    name: api-gateway
  profiles:
    default: prod
  config:
    import: classpath:gateway-routes.yml

server:
  port: 3000

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      issuer: ${APP_SECURITY_JWT_ISSUER}
      audience: ${APP_SECURITY_JWT_AUDIENCE}

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

public:
  endpoints:
    - /api/users/auth/login
    - /api/users/auth/register
    - /api/users/auth/refresh
    - /api/users/auth/google
    - /api/users/auth/logout
    - /ws

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
  paths-to-match: /api/**
