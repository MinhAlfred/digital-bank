spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            customer-service:
              - uri: ${CUSTOMER_SERVICE_URI:http://localhost:4001}
            core-banking-service:
              - uri: ${CORE_BANKING_SERVICE_URI:http://localhost:4000}
            notification-service:
              - uri: ${NOTIFICATION_SERVICE_URI:http://localhost:4002}
            fraud-detection-service:
              - uri: ${FRAUD_DETECTION_SERVICE_URI:http://localhost:4003}
            analysis-service:
              - uri: ${ANALYSIS_SERVICE_URI:http://localhost:4004}
  config:
    import: classpath:gateway-routes.yml

app:
  security:
    jwt:
      secret: test-only-bank-key-32-bytes-minimum
      issuer: https://issuer.example.test
      audience: digital-bank-test

gateway:
  internal-secret: test-only-internal-secret
